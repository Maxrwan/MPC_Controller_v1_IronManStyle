<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css"><title>Native recorded replay</title>
<body><p id="notice" role="status">Loading verified recording…</p><main hidden>
<div class="bar"><button id="play">Play</button><button id="restart">Restart</button><button id="back">Previous sample</button><button id="next">Next sample</button>
<label>Speed <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
<output id="time" aria-live="off"></output></div>
<label>Native sample timeline <input id="timeline" type="range" min="0" step="1" value="0"></label>
<div class="bar"><label>Prediction <select id="packet"><option value="active">Follow active packet</option></select></label><label>View <select id="view"><option value="window">Run window</option><option value="track">Whole track</option></select></label></div>
<canvas id="track" role="img" aria-label="Recorded vehicle position, canonical track and selected prediction"></canvas>
<div id="readout" class="readout"></div><p id="authority"></p>
<p class="muted">XY marker: display-only linear interpolation between retained positions; held across documented state kicks. Readouts, commands, packet identity and metrics use native records. No optimizer or plant runs.</p>
<details><summary>Tracking and commands</summary><canvas id="error" role="img" aria-label="Native racing-reference lateral error"></canvas><canvas id="command" role="img" aria-label="Recorded requested and applied steering"></canvas></details>
<details id="details"><summary>Selected prediction and scheduling details</summary><label>Prediction node <input id="node" type="range" min="0" step="1" value="0"></label><pre id="diagnostics"></pre></details>
<p id="coverage" class="muted"></p></main><script type="module" src="viewer.mjs"></script></body></html>
